# =============================================================================
# Pre-commit hooks.
#
# Two of these are not style tools and must never be removed:
#
#   nbstripout       — a notebook output cell on this project can contain
#                      patient-level rows. Stripping outputs at commit time is
#                      the only reliable defence, because .gitignore does not
#                      help once the notebook itself is tracked.
#   detect-secrets   — credentials in git history survive every later fix.
#
#   install:  uv run pre-commit install
#   run all:  uv run pre-commit run --all-files
# =============================================================================

default_language_version:
  python: python3.11

fail_fast: false

repos:
  # --- Baseline hygiene ------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'          # trailing spaces are meaningful line breaks in md
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict   # matters: this repo is developed on Windows, run on Linux
      - id: mixed-line-ending
        args: [--fix=lf]
        # Windows-native scripts are excluded: .gitattributes declares them
        # eol=crlf because PowerShell and cmd require it, so forcing LF here
        # would fight that rule on every commit — the hook "fixes" the file,
        # git checks it back out as CRLF, and the loop repeats forever.
        exclude: '\.(ps1|bat|cmd)$'
      - id: debug-statements

      # Model artifacts, MLflow stores and dataset files all exceed this. The
      # limit is the backstop for when .gitignore is wrong.
      - id: check-added-large-files
        args: [--maxkb=512]

      - id: no-commit-to-branch
        args: [--branch, main]    # phases land via PR, never direct to main

  # --- Lint + format ---------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Types -----------------------------------------------------------------
  #
  # Runs the project's own mypy through uv, NOT mirrors-mypy in an isolated
  # environment. That mirror was tried and abandoned twice for the same reason:
  # its env holds a different dependency set from the project venv, so
  # `ignore_missing_imports` resolves differently and the hook reported errors
  # that `make typecheck` did not — and vice versa. Pinning the mirror's deps to
  # match meant reinstalling pandas/sklearn on every rev bump, slow enough to
  # look like a hung commit.
  #
  # A hook that disagrees with the local command is worse than no hook: it
  # teaches you to bypass it. `language: system` guarantees both run identically.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv, same as `make typecheck`)
        entry: uv run mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
        args: [src]

  # --- Notebook output stripping --------------------------------------------
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        name: strip notebook outputs (may contain patient rows)

  # --- Secrets ---------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # reports/{data_audit,training_summary}.json are generated by this repo
        # from a public dataset and contain no credentials. They are excluded
        # because they carry SHA256 feature-schema hashes, which trip the
        # high-entropy-string detector. A baseline entry would be the usual fix,
        # but those hashes change legitimately whenever the feature set changes,
        # so the baseline would go stale on every retrain and stop being read.
        exclude: |
          (?x)^(
            uv\.lock|
            \.secrets\.baseline|
            reports/data_audit\.json|
            reports/training_summary\.json
          )$

  # --- Commit message --------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
