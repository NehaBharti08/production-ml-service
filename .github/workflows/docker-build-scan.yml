# =============================================================================
# Build the serving image and scan it for vulnerabilities.
#
# Separate from ci.yml because it is slower and has different failure semantics:
# a CVE in a base image is not a code defect, and mixing the two would make a
# red CI badge ambiguous.
#
# The scan gates on HIGH and CRITICAL. This is the check the "only the serve
# dependency group is installed" decision in Dockerfile.api exists to satisfy —
# every package not installed is a package that cannot become a finding.
# =============================================================================

name: Docker build and scan

on:
  pull_request:
    paths:
      - "deploy/docker/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build-scan.yml"
  push:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

jobs:
  build-and-scan:
    name: build, scan, smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      # Loaded into the local daemon rather than pushed: the image has to be
      # scanned and smoke-tested before it is worth publishing anywhere.
      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          tags: mlservice-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # Smoke test. The container has to actually start before a vulnerability
      # scan of it means anything.
      #
      # This is also the first place graceful shutdown can be verified: Windows
      # has no SIGTERM semantics, so the drain path could not be tested during
      # development.
      # ---------------------------------------------------------------------
      - name: Start container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e MLSERVICE_ENV=local \
            -e MLSERVICE_MLFLOW__TRACKING_URI= \
            mlservice-api:ci

      - name: Wait for liveness
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health/live > /dev/null; then
              echo "live after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container never became live"; docker logs api; exit 1

      - name: Readiness reports honestly without a model
        run: |
          # No artifact is baked into the CI image, so readiness MUST report 503.
          # A 200 here would mean readiness is not actually checking the model,
          # which would break the Phase 7 rollback demo.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health/ready)
          echo "readiness returned $code"
          if [ "$code" != "503" ]; then
            echo "expected 503 without a model, got $code"
            docker logs api
            exit 1
          fi

      - name: Prediction returns 503, not 500, when unready
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:8000/v1/predict \
            -H 'Content-Type: application/json' -d '{"features":{}}')
          # 422 (validation) or 503 (no model) are both correct; 500 is not.
          if [ "$code" = "500" ]; then
            echo "unready service returned 500; it must return 503"
            docker logs api; exit 1
          fi
          echo "returned $code"

      # ---------------------------------------------------------------------
      # THE SUCCESS PATH.
      #
      # Everything above tests that an unready service reports itself unready —
      # correct, and precisely why a container that could NEVER serve passed CI
      # for five phases. The `serve` dependency group excludes mlflow by design
      # and .dockerignore excludes models/ by design, so nothing in the image
      # could load a model, and no check ever asserted that anything should.
      # It was found by making one HTTP request to a running container.
      #
      # So: mount an artifact and assert the container actually serves it, with
      # the threshold from the artifact's own metadata rather than the config
      # placeholder. A stub model suffices — what is under test is the plumbing
      # (mount -> load -> serve -> honour the contract), which is what broke.
      #
      # The stub is generated INSIDE the image, so it is pickled by the exact
      # scikit-learn the runtime will unpickle it with. Building it on the
      # runner would risk a version mismatch failing this test for a reason
      # that has nothing to do with what it checks.
      # ---------------------------------------------------------------------
      - name: Build a stub artifact using the image's own scikit-learn
        run: |
          set -euo pipefail
          mkdir -p artifact/champion
          docker run --rm -v "${PWD}/artifact:/out" --entrypoint python mlservice-api:ci -c "
          import json, joblib
          from sklearn.dummy import DummyClassifier
          m = DummyClassifier(strategy='prior').fit([[0.0],[1.0]], [0,1])
          joblib.dump(m, '/out/champion/model.joblib')
          json.dump({'champion':'stub','champion_threshold':0.1011,
                     'feature_schema_hash':'ci-stub-hash'},
                    open('/out/champion/metadata.json','w'))
          print('stub artifact written')
          "
          ls -la artifact/champion/

      - name: Start a container with the artifact mounted
        run: |
          docker rm -f api-served >/dev/null 2>&1 || true
          docker run -d --name api-served -p 8001:8000 \
            -e MLSERVICE_ENV=local \
            -e MLSERVICE_MLFLOW__TRACKING_URI= \
            -v "${PWD}/artifact:/app/models:ro" \
            mlservice-api:ci

      - name: It must become READY, not merely live
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health/ready || echo 000)
            if [ "$code" = "200" ]; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::container never became READY with an artifact mounted"
          docker logs api-served
          exit 1

      - name: It must serve the artifact's threshold, not the config placeholder
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8001/v1/model -o served.json
          cat served.json
          python - <<'PY'
          import json, sys

          d = json.load(open("served.json"))
          threshold = d.get("decision_threshold")
          schema = d.get("feature_schema_hash")
          print("served threshold:", threshold, "schema:", schema)

          if threshold != 0.1011:
              print(f"::error::served threshold {threshold}, expected 0.1011 from the artifact")
              print("::error::this is the bug where a model tuned to 0.1011 was served at 0.5,")
              print("::error::flagging nobody while reporting itself perfectly healthy")
              sys.exit(1)
          if schema != "ci-stub-hash":
              print(f"::error::served schema hash {schema}, expected ci-stub-hash")
              sys.exit(1)
          print("OK: the artifact's contract reached the serving layer")
          PY

      - name: Clean up the served container
        if: always()
        run: docker rm -f api-served >/dev/null 2>&1 || true

      - name: Graceful shutdown drains rather than dropping
        run: |
          # Could not be verified during development: Windows Stop-Process is a
          # hard kill with no SIGTERM. This is the first real test of the
          # exec-form CMD (uvicorn as PID 1) and --timeout-graceful-shutdown.
          docker stop --timeout 30 api
          docker logs api 2>&1 | tail -20
          if docker logs api 2>&1 | grep -q "service_stopping"; then
            echo "clean shutdown confirmed"
          else
            echo "no service_stopping log line — SIGTERM did not reach uvicorn"
            exit 1
          fi

      - name: Remove container
        if: always()
        run: docker rm -f api || true

      # ---------------------------------------------------------------------
      # Vulnerability scan
      # ---------------------------------------------------------------------
      - name: Trivy scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mlservice-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # an unfixable base-image CVE is not actionable here
          exit-code: "1"

      - name: Trivy SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mlservice-api:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: trivy.sarif
        continue-on-error: true   # forks cannot write security events
