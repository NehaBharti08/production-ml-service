[project]
name = "mlservice"
version = "0.1.0"
description = "Production ML service for 30-day hospital readmission risk — an operations demonstration, not a clinical tool."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Neha Bharti" }]
keywords = ["mlops", "monitoring", "drift-detection", "model-serving", "calibration"]

# Runtime dependencies are deliberately minimal: this is what the API container
# installs. Training, monitoring and dev tooling live in dependency groups so
# the serving image stays small and its attack surface stays reviewable.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
mlservice = "mlservice.cli:app"

[dependency-groups]
# uv installs `dev` by default. Groups are additive: `uv sync --group train`.
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    # Load testing. The plan permits k6 or Locust; Locust is chosen because it
    # installs as a Python package — no admin rights, no separate toolchain,
    # and it runs today against the host process while Docker is still absent.
    "locust>=2.31",
]

train = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "mlflow>=2.16",
    "requests>=2.32",
]

serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.21",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "huggingface-hub>=0.26",
]

monitor = [
    "evidently>=0.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "pyarrow>=17.0",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlservice"]

# =============================================================================
# Ruff — lint + format. Replaces black/isort/flake8 with one fast tool.
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes — every timestamp here must be tz-aware
    "T20",      # no print() — we have structured logging
    "PT",       # pytest style
    "RET",      # return simplification
    "SIM",      # simplify
    "ARG",      # unused arguments
    "PTH",      # prefer pathlib
    "PD",       # pandas-vet
    "NPY",      # numpy legacy random
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PD"]
"notebooks/**" = ["T20", "E402"]
"scripts/**" = ["T20"]
# These modules generate prose for markdown documents. En dashes, ρ and × are
# deliberate typography in the rendered output, not ambiguous-character typos.
"src/mlservice/data/render_audit.py" = ["RUF001"]
"src/mlservice/models/render_card.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["mlservice"]

# =============================================================================
# mypy — strict on our code, lenient at the boundaries of untyped libraries.
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "sklearn.*", "mlflow.*", "evidently.*", "matplotlib.*",
    "pandas.*", "scipy.*", "prometheus_client.*", "huggingface_hub.*",
    "joblib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# =============================================================================
# pytest — markers keep the five suites independently runnable, which matters
# because CI runs them as separate jobs and only some need a live container.
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: pure functions, no I/O",
    "contract: API schema stability",
    "integration: requires a running container",
    "behavior: model invariance and directional expectations",
    "data: data-quality assertions, requires the dataset",
    "slow: excluded from the fast CI path",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/mlservice"]
branch = true
omit = ["*/cli.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
