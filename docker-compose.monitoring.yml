# =============================================================================
# Monitoring overlay — Prometheus + Grafana.
#
#   make full     docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# An overlay rather than a profile so the core stack stays runnable on its own.
# Day-to-day development does not need 1 GB of observability running.
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days is plenty for a demo and keeps the volume small. Drift analysis
      # reads the prediction log, not Prometheus, so long metric retention buys
      # nothing here.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle          # reload rules without a restart
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # Serves the drift metrics that `mlservice monitor check` writes.
  #
  # node_exporter is here for its textfile collector alone — the host metrics
  # it also exposes are incidental and nothing scrapes them into a dashboard.
  # The monitoring job is a batch process with no port of its own, and this is
  # the standard way to get a batch job's metrics into Prometheus without a
  # pushgateway's "dead job looks healthy" failure mode.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
      # Everything else off: this container exists to serve one file, and the
      # default collector set is a large surface for no benefit here.
      - --collector.disable-defaults
      - --collector.textfile
    volumes:
      - ./data/monitoring:/var/lib/node_exporter/textfile:ro
    expose:
      - "9100"
    deploy:
      resources:
        limits:
          memory: 64M

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Points at the renderer below. Harmless when it is not running: Grafana
      # only contacts it for /render requests, which nothing issues in normal
      # use.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    ports:
      - "3000:3000"
    volumes:
      # Datasources and dashboards are provisioned from files, never clicked in.
      # A dashboard that exists only in a volume is not committed, cannot be
      # reviewed, and disappears with `make clean` — so dashboards are code.
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  # Renders dashboards to PNG for the documentation.
  #
  # Behind a profile, so `up` does not start it: it is a headless Chromium and
  # costs ~300 MB, which is not worth paying to serve a dashboard nobody is
  # screenshotting. Start it only when re-capturing:
  #
  #   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml \
  #     --profile capture up -d renderer
  #
  # Capturing through the API rather than by hand is the point. A screenshot
  # taken manually cannot be reproduced, and the images in docs/ went stale
  # through an entire domain change without anything noticing.
  renderer:
    image: grafana/grafana-image-renderer:3.12.1
    profiles: ["capture"]
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"
    expose:
      - "8081"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  prometheus-data:
  grafana-data:
