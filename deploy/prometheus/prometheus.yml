# =============================================================================
# Prometheus scrape configuration.
# Alert rules live in rules/ and are justified individually there.
# =============================================================================

global:
  # 15s is the Prometheus default and is right here: the API's latency
  # histogram needs enough samples per window for p99 to mean anything, and
  # scraping faster would only add noise and storage.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    service: mlservice

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mlservice-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  # Drift metrics come from `mlservice monitor check`, which is a periodic
  # batch job with no port to scrape. It writes a textfile
  # (data/monitoring/drift_metrics.prom) and node_exporter's textfile
  # collector serves it.
  #
  # Deliberately not a Pushgateway: a pushgateway keeps serving the last
  # value forever after the job stops, so a dead monitoring job looks like a
  # permanently healthy one. A file has an mtime, and the staleness alert
  # below is written against it.
  #
  # This job did not exist until 2026-09-23. The drift dashboard was built in
  # Phase 5 against a metric contract that Phase 6's job then wrote to a file
  # nothing scraped, so all four of its panels had never rendered a value.
  - job_name: drift-textfile
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: monitoring-job

# Alertmanager is deliberately not wired up. Alert *rules* are the artifact
# worth demonstrating — they encode the thresholds and their reasoning. Routing
# them to a paging provider adds a dependency and demonstrates nothing further
# on a single-developer project. Rules fire and are visible in Prometheus and
# on the Grafana alert panel.
