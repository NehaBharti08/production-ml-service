# =============================================================================
# Prometheus scrape configuration.
# Alert rules live in rules/ and are justified individually there.
# =============================================================================

global:
  # 15s is the Prometheus default and is right here: the API's latency
  # histogram needs enough samples per window for p99 to mean anything, and
  # scraping faster would only add noise and storage.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    service: mlservice

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mlservice-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

# Alertmanager is deliberately not wired up. Alert *rules* are the artifact
# worth demonstrating — they encode the thresholds and their reasoning. Routing
# them to a paging provider adds a dependency and demonstrates nothing further
# on a single-developer project. Rules fire and are visible in Prometheus and
# on the Grafana alert panel.
